<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <!-- Yellow-billed magpie, perched profile facing left.

       Composed from primitives rather than one hand-drawn outline, so
       every proportion is a number that can be adjusted directly:

         body   rotated ellipse, 15.2 long x 9 deep, tilted 36 degrees
         head   circle, r 3.9, with a small neck ellipse bridging it
                to the body so the junction stays convex
         bill   short stout triangle, 3.6 long
         tail   tapered quad, 16.5 long, 6 wide at the base and 2.8 at
                the tip, set at 41 degrees, base buried inside the
                body so the silhouette reads as one mass

       The tail is the whole point. On a real bird it is longer than
       the body and graduated, so here it matches the body's length and
       carries roughly half the icon's mass. The eye is a real hole via
       mask, so it reads on any background. -->

  <mask id="magpie-eye">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="10.6" cy="7.4" r="1.05" fill="#000"/>
  </mask>

  <g fill="currentColor" mask="url(#magpie-eye)">
    <path d="M0 -3.0 L16.5 -1.4 L16.5 1.4 L0 3.0 Z"
          transform="translate(15.6 14.6) rotate(41)"/>
    <ellipse cx="14.2" cy="14.6" rx="7.6" ry="4.5"
             transform="rotate(36 14.2 14.6)"/>
    <ellipse cx="11.2" cy="10.6" rx="3.7" ry="3.4"/>
    <circle cx="9.6" cy="7.9" r="3.9"/>
    <path d="M6.6 6.4 L3.1 8.4 L6.8 10.0 Z"/>
    <path d="M11.9 19.5h1.05v4.3h-1.05z M15.0 19.4h1.05v4.4h-1.05z"/>
    <path d="M10.9 23.8h2.7v0.95h-2.7z M14.0 23.8h2.7v0.95h-2.7z"/>
  </g>
</svg>
